<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figma</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            background-image: url("img/fondo.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="m-0 w-full min-h-screen flex items-center justify-center bg-[url('img/fondo.png')] bg-cover bg-center bg-no-repeat">

    <div class="w-[23rem] rounded-[3.5rem] border border-white/20 bg-black/60 backdrop-blur-xl shadow-2xl px-4 pt-3 pb-5">

        <div class="h-[8.4rem] rounded-[2rem] border-4 border-blue-500 bg-gray-300 overflow-hidden">
            <img src="img/Imagen logo vinyeta.png" class="w-full h-full object-contain">
        </div>

        <div class="mt-5 px-2">
        <p class="text-white font-bold">Nom d'usuari:</p>
        <input type="text"
        class="h-[3.8rem] w-full rounded-xl bg-gray-500 px-4 text-white outline-none">
        </div>

        <div class="mt-4 px-2">
        <p class="text-white font-bold">Correu electrònic:</p>
        <input type="text"
        class="h-[3.8rem] w-full rounded-xl bg-gray-500 px-4 text-white outline-none">
        </div>

        <div class="mt-4 px-2">
        <p class="text-white font-bold">Contrasenya:</p>
        <input type="text"
        class="h-[3.8rem] w-full rounded-xl bg-gray-500 px-4 text-white outline-none">
        </div>

        <div class="flex items-center justify-center mt-6">
            <a href="index.html"
               class="w-full h-11 rounded-xl bg-gray-200 flex items-center justify-center text-gray-900 font-extrabold text-sm">
                Registrar-se
            </a>
        </div>

    </div>

</body>
</html>
