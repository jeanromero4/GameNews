
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar-se - Figma</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="m-0 w-full min-h-screen flex items-center justify-center bg-[url('img/fondo.png')] bg-cover bg-center bg-no-repeat">

    <a href="#main"
       class="absolute -top-20 left-4 z-50 bg-white text-black p-3 rounded focus:top-4 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-600 focus-visible:outline-offset-4">
        Saltar al contenido principal
    </a>

    <main id="main" tabindex="-1"
          class="w-full min-h-screen flex items-center justify-center px-4">

        <section aria-label="Formulario de registro"
                 class="w-[23rem] max-w-full rounded-[3.5rem] border border-white/20 bg-black/60 backdrop-blur-xl shadow-2xl px-4 pt-3 pb-5">

            <div class="h-[8.4rem] rounded-[2rem] border-4 border-blue-500 bg-gray-300 overflow-hidden">
                <img
                    src="img/Imagen logo vinyeta.png"
                    alt="Logotipo de la página"
                    class="w-full h-full object-contain">
            </div>

            <form id="register-form" action="index.html" method="get" novalidate>

                <div class="mt-5 px-2">
                    <label for="username"
                           class="block text-white font-bold mb-2">
                        Nom d'usuari:
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        autocomplete="username"
                        required
                        class="h-[3.8rem] w-full rounded-xl bg-gray-500 px-4 text-white border border-white/50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-300 focus-visible:outline-offset-4">
                </div>

                <div class="mt-4 px-2">
                    <label for="email"
                           class="block text-white font-bold mb-2">
                        Correu electrònic:
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        required
                        class="h-[3.8rem] w-full rounded-xl bg-gray-500 px-4 text-white border border-white/50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-300 focus-visible:outline-offset-4">
                </div>

                <div class="mt-4 px-2">
                    <label for="password"
                           class="block text-white font-bold mb-2">
                        Contrasenya:
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="new-password"
                        required
                        class="h-[3.8rem] w-full rounded-xl bg-gray-500 px-4 text-white border border-white/50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-300 focus-visible:outline-offset-4">
                </div>

                <p id="form-status"
                   role="alert"
                   aria-live="assertive"
                   class="mt-3 px-2 text-white text-sm text-center">
                </p>

                <div class="flex items-center justify-center mt-6">
                    <button
                        id="submit-button"
                        type="submit"
                        class="w-full min-h-11 rounded-xl bg-gray-200 flex items-center justify-center text-gray-900 font-extrabold text-sm focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-600 focus-visible:outline-offset-4">
                        Registrar-se
                    </button>
                </div>

            </form>

        </section>

    </main>

    <script src="registre.js"></script>

</body>
</html>
