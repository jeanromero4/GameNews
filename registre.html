
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Registra't per crear un compte i accedir a l'aplicació.">
    <title>Registrar-se</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            background-image: url("img/fondo.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>

<body class="m-0 w-full min-h-screen flex items-center justify-center bg-[url('img/fondo.png')] bg-cover bg-center bg-no-repeat">

    <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:bg-white focus:text-black focus:p-3 focus:rounded-lg">
        Salta al contingut principal
    </a>

    <main id="main" class="w-full flex items-center justify-center px-4">

        <section aria-labelledby="register-title" class="w-[23rem] rounded-[3.5rem] border border-white/20 bg-black/60 backdrop-blur-xl shadow-2xl px-4 pt-3 pb-5">

            <h1 id="register-title" class="sr-only">Crear un compte</h1>

            <div class="h-[8.4rem] rounded-[2rem] border-4 border-blue-500 bg-gray-300 overflow-hidden">
                <img
                    src="img/Imagen logo vinyeta.png"
                    alt="Logotip de l'aplicació"
                    class="w-full h-full object-contain"
                >
            </div>

            <form action="#" method="post">

                <div class="mt-5 px-2">
                    <label for="username" class="block text-white font-bold mb-2">
                        Nom d'usuari:
                    </label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        required
                        class="h-[3.8rem] w-full rounded-xl bg-gray-500 px-4 text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-400"
                    >
                </div>

                <div class="mt-4 px-2">
                    <label for="email" class="block text-white font-bold mb-2">
                        Correu electrònic:
                    </label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                        class="h-[3.8rem] w-full rounded-xl bg-gray-500 px-4 text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-400"
                    >
                </div>

                <div class="mt-4 px-2">
                    <label for="password" class="block text-white font-bold mb-2">
                        Contrasenya:
                    </label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="new-password"
                        required
                        class="h-[3.8rem] w-full rounded-xl bg-gray-500 px-4 text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-400"
                    >
                </div>

                <div class="flex items-center justify-center mt-6">
                    <button
                        type="submit"
                        class="w-full h-11 rounded-xl bg-gray-200 flex items-center justify-center text-gray-900 font-extrabold text-sm focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-400"
                    >
                        Registrar-se
                    </button>
                </div>

            </form>

        </section>

    </main>

</body>
</html>
