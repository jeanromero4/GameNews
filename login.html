
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicio de sesión de usuario">

    <title>Iniciar sesión</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="m-0 w-full min-h-screen flex items-center justify-center bg-[url('img/fondo.png')] bg-cover bg-center bg-no-repeat">

    <a href="#main"
       class="absolute left-[-9999px] top-2 z-50 bg-white text-black p-3
              focus:left-2 focus:outline focus:outline-4 focus:outline-blue-700">
        Saltar al contenido principal
    </a>

    <main id="main" class="w-full flex items-center justify-center">

        <div class="relative w-[23rem] h-[30.6rem] rounded-[3.5rem]
                    border border-white/20 bg-black/60 backdrop-blur-xl
                    shadow-2xl px-4 pt-3">

            <h1 class="sr-only">
                Iniciar sesión o registrarse
            </h1>

            <div class="h-[8.4rem] w-full rounded-[2rem] border-4
                        border-blue-400 bg-gray-300 overflow-hidden">

                <img
                    src="img/Imagen logo vinyeta.png"
                    alt="Logotipo de la aplicación"
                    class="w-full h-full object-contain"
                >

            </div>

            <form class="mt-5 px-2" action="login.php" method="post">

                <div>

                    <label for="email"
                           class="block text-white font-extrabold text-base leading-5 mb-1">
                        Correu electrònic:
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                        class="h-[3.8rem] w-full rounded-xl bg-[#777777] px-4 text-white
                               focus-visible:outline focus-visible:outline-4
                               focus-visible:outline-blue-400"
                    >

                </div>

                <div class="mt-4">

                    <label for="password"
                           class="block text-white font-extrabold text-base leading-5 mb-1">
                        Contrasenya:
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                        class="h-[3.8rem] w-full rounded-xl bg-[#777777] px-4 text-white
                               focus-visible:outline focus-visible:outline-4
                               focus-visible:outline-blue-400"
                    >

                </div>

                <div class="flex items-center gap-1.5 mt-6">

                    <button
                        type="submit"
                        class="flex-1 h-11 rounded-xl bg-[#e5e5e5]
                               flex items-center justify-center text-black
                               font-extrabold text-sm whitespace-nowrap
                               focus-visible:outline focus-visible:outline-4
                               focus-visible:outline-blue-400">
                        Iniciar sessió
                    </button>

                    <div
                        class="w-12 h-11 rounded-xl bg-[#c8c8c8]
                               flex items-center justify-center text-black
                               font-extrabold text-sm"
                        aria-hidden="true">
                        o
                    </div>

                    <a
                        href="registre.html"
                        class="flex-1 h-11 rounded-xl bg-gray-200
                               flex items-center justify-center text-gray-900
                               font-extrabold text-sm
                               focus-visible:outline focus-visible:outline-4
                               focus-visible:outline-blue-400">
                        Registrar-se
                    </a>

                </div>

            </form>

        </div>

    </main>

</body>
</html>
