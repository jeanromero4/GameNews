
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Página principal de la aplicación web">

    <title>Página principal</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="m-0 w-full min-h-screen relative bg-[url('img/fondo.png')] bg-cover bg-center bg-no-repeat">

    <a href="#main"
       class="absolute left-[-9999px] top-2 z-50 bg-white text-black p-3
              focus:left-2 focus:outline focus:outline-4 focus:outline-blue-700">
        Saltar al contenido principal
    </a>

    <header class="w-full">

        <img
            src="img/logo.png"
            alt="Logotipo de la página"
            class="absolute top-4 left-4 w-32 h-auto"
        >

        <nav aria-label="Navegación principal"
             class="absolute top-4 right-4 flex items-center gap-2">

            <button
                type="button"
                aria-label="Buscar"
                class="rounded focus-visible:outline focus-visible:outline-4 focus-visible:outline-blue-700">

                <img
                    src="img/lupa.png"
                    alt=""
                    class="w-[4rem] h-auto"
                >

            </button>

            <a
                href="login.html"
                aria-label="Acceder o registrar un usuario"
                class="rounded focus-visible:outline focus-visible:outline-4 focus-visible:outline-blue-700">

                <img
                    src="img/agrerarusuario.png"
                    alt=""
                    class="w-[4rem] h-auto cursor-pointer"
                >

            </a>

            <button
                id="menuButton"
                type="button"
                aria-label="Abrir menú desplegable"
                aria-expanded="false"
                aria-controls="dropdownMenu"
                class="rounded focus-visible:outline focus-visible:outline-4 focus-visible:outline-blue-700">

                <img
                    src="img/desplegable.png"
                    alt=""
                    class="w-[4rem] h-auto"
                >

            </button>

        </nav>

        <div
            id="dropdownMenu"
            hidden
            class="absolute top-20 right-4 z-50 bg-white p-4 shadow-lg rounded">

            <nav aria-label="Navegación secundaria"
                 class="flex flex-col gap-3">

                <a href="index.html"
                   class="text-black hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-700">
                    Inicio
                </a>

                <a href="login.html"
                   class="text-black hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-700">
                    Iniciar sesión
                </a>

            </nav>

        </div>

    </header>

    <main id="main" class="w-full">

        <h1 class="sr-only">
            Página principal
        </h1>

        <section
            aria-label="Contenido principal"
            class="absolute bottom-0 left-1/2 -translate-x-1/2
                   w-[75rem] max-w-full grid grid-cols-1 sm:grid-cols-2
                   gap-1 p-0">

            <div class="translate-y-8">
                <img
                    src="img/Rectangle1.png"
                    alt=""
                    class="w-full h-auto block"
                >
            </div>

            <div class="translate-y-8">
                <img
                    src="img/Rectangle2.png"
                    alt=""
                    class="w-full h-auto block"
                >
            </div>

            <div>
                <img
                    src="img/Rectangle3.png"
                    alt=""
                    class="w-full h-auto block"
                >
            </div>

            <div>
                <img
                    src="img/Rectangle4.png"
                    alt=""
                    class="w-full h-auto block"
                >
            </div>

        </section>

    </main>

    <script>

        const menuButton = document.getElementById("menuButton");
        const dropdownMenu = document.getElementById("dropdownMenu");

        menuButton.addEventListener("click", () => {

            const isExpanded =
                menuButton.getAttribute("aria-expanded") === "true";

            menuButton.setAttribute(
                "aria-expanded",
                String(!isExpanded)
            );

            menuButton.setAttribute(
                "aria-label",
                isExpanded
                    ? "Abrir menú desplegable"
                    : "Cerrar menú desplegable"
            );

            dropdownMenu.hidden = isExpanded;

        });

        document.addEventListener("keydown", (event) => {

            if (event.key === "Escape" &&
                menuButton.getAttribute("aria-expanded") === "true") {

                dropdownMenu.hidden = true;

                menuButton.setAttribute("aria-expanded", "false");

                menuButton.setAttribute(
                    "aria-label",
                    "Abrir menú desplegable"
                );

                menuButton.focus();
            }

        });

    </script>

</body>
</html>
